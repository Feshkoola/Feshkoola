<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="icon" type="image/x-icon" href="/Assets/Logos/Favicon.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feshkoola</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav>
      <ul>
        <li id="logo">
          <a href="account.html"
            ><img src="Assets/Logos/Feshkoola Logo.png" alt="Logo" class="logo"
          /></a>
        </li>
        <li><a href="index.html">Home</a></li>
        <li><a href="travel.html">Travel</a></li>
        <li id="selectedNav"><a id="selectedNav" href="shop.html">Shop</a></li>
        <li><a href="news.html">News</a></li>
        <li><a href="email.html">Email</a></li>
      </ul>
    </nav>

    <div class="shop-container">
      <div class="shop-item fade-in-section">
        <img
          src="Assets/Images/Shop Images/Products/Bic Pens.jpg"
          alt="Product 1"
          class="product-image"
          style="width: 70%"
        />
        <div class="product-name">Bic Pens</div>
        <div class="product-price">£3.50</div>
        <div class="product-quantity">
          <label for="quantity1">Quantity:</label>
          <input
            type="number"
            id="quantity1"
            name="quantity1"
            min="1"
            value="1"
          />
        </div>
        <button class="add-to-cart" onclick="addToCart('Bic Pens', 1, 3.5)">
          Add to Cart
        </button>
      </div>
      <div class="shop-item fade-in-section">
        <img
          src="Assets/Images/Shop Images/Products/My Turtle.jpg"
          alt="Product 2"
          class="product-image"
        />
        <div class="product-name">Turtle</div>
        <div class="product-price">£10,000,000.00</div>
        <div class="product-quantity">
          <label for="quantity2">Quantity:</label>
          <input
            type="number"
            id="quantity2"
            name="quantity2"
            min="1"
            value="1"
            max="1"
          />
        </div>
        <button
          class="add-to-cart"
          onclick="addToCart('Turtle', 2, 10000000.0)"
        >
          Add to Cart
        </button>
      </div>
      <div class="shop-item fade-in-section">
        <img
          src="Assets/Images/Shop Images/Products/Toxic Waste.jpg"
          alt="Product 3"
          class="product-image"
          style="width: 70%"
        />
        <div class="product-name">Toxic Waste</div>
        <div class="product-price">£0.90</div>
        <div class="product-quantity">
          <label for="quantity3">Quantity:</label>
          <input
            type="number"
            id="quantity3"
            name="quantity3"
            min="1"
            value="1"
          />
        </div>
        <button class="add-to-cart" onclick="addToCart('Toxic Waste', 3, 0.9)">
          Add to Cart
        </button>
      </div>
      <div class="shop-item fade-in-section">
        <img
          src="Assets/Images/Shop Images/Products/Cap's Shield.webp"
          alt="Product 1"
          class="product-image"
          style="width: 55%"
        />
        <div class="product-name">Cap's Shield</div>
        <div class="product-price">£150.00</div>
        <div class="product-quantity">
          <label for="quantity1">Quantity:</label>
          <input
            type="number"
            id="quantity4"
            name="quantity4"
            min="1"
            value="1"
          />
        </div>
        <button
          class="add-to-cart"
          onclick="addToCart('Captain Americas Shield', 4, 150.0)"
        >
          Add to Cart
        </button>
      </div>
      <div class="shop-item fade-in-section">
        <img
          src="Assets/Images/Shop Images/Products/Drone.webp"
          alt="Product 2"
          class="product-image"
        />
        <div class="product-name">Drone</div>
        <div class="product-price">£199.00</div>
        <div class="product-quantity">
          <label for="quantity2">Quantity:</label>
          <input
            type="number"
            id="quantity5"
            name="quantity5"
            min="1"
            value="1"
          />
        </div>
        <button class="add-to-cart" onclick="addToCart('Drone', 5, 199.0)">
          Add to Cart
        </button>
      </div>
      <div class="shop-item fade-in-section">
        <img
          src="Assets/Images/Shop Images/Products/Cheesey Nibbles.webp"
          alt="Product 3"
          class="product-image"
          style="width: 80%"
        />
        <div class="product-name">Cheesey Nibbles</div>
        <div class="product-price">£0.20</div>
        <div class="product-quantity">
          <label for="quantity3">Quantity:</label>
          <input
            type="number"
            id="quantity6"
            name="quantity6"
            min="1"
            value="1"
          />
        </div>
        <button
          class="add-to-cart"
          onclick="addToCart('Cheesey Nibbles', 6, 0.2)"
        >
          Add to Cart
        </button>
      </div>
    </div>
    <a href="cart.html"><button class="view-cart">View Cart</button></a>

    <script src="script.js"></script>
  </body>
</html>
